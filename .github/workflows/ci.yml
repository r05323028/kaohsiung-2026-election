name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pull requests supersede obsolete runs. Main and Pages deployments are not
  # cancelled mid-flight.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # validate:all covers the 28 data/editorial validators and typecheck.
      - name: Validate datasets and types
        run: npm run validate:all
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test

  build:
    name: Static build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # One canonical build. validate:profile-copy reads dist/candidates, so it
      # must run before the non-root build replaces dist.
      - name: Build and validate profile copy
        run: npm run build:pages
      - name: Static build with a non-root base path
        run: BASE_PATH=/kaohsiung-civic-stories/ npm run build:astro

  critical-browser:
    name: Critical browser tests (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # @critical is the deliberately small set of transitions and geographic
      # invariants that must block a merge. The full suite runs in e2e.yml.
      - name: Browser critical path
        run: >-
          npx playwright test
          --grep @critical
          --shard=${{ matrix.shard }}/2
          --workers=1
          --retries=1
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-critical-shard-${{ matrix.shard }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
