                    if($(this).hasClass('sizeSmall')){
                        $('size').removeClass('sizeMiddle');
                        $('size').removeClass('sizeBig');
                        $('body').removeClass().addClass('bodySmall');
                    }else if($(this).hasClass('sizeMiddle')){
                        $('size').removeClass('sizeSmall');
                        $('size').removeClass('sizeBig');
                        $('body').removeClass();
                    }else if($(this).hasClass('sizeBig')){
                        $('size').removeClass('sizeSmall');
                        $('size').removeClass('sizeMiddle');
                        $('body').removeClass().addClass('bodyBig');

                });
            });
